services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    restart: unless-stopped
    # Chạy bằng root chỉ để đơn giản hoá quyền truy cập /var/run/docker.sock khi demo local.
    # KHÔNG dùng cách này cho môi trường production thật.
    user: root
    ports:
      - "8081:8080"   # UI Jenkins -> http://localhost:8081 (đổi cổng để tránh trùng app chạy ở 8080)
      - "50000:50000" # cổng cho Jenkins agent (JNLP), không bắt buộc với agent any trên controller
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cicd-net

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - cicd-net

networks:
  cicd-net:
    driver: bridge

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
